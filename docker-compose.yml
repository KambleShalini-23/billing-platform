services:
   postgres:
     image: postgres:16-alpine
     container_name: billing-postgres
     environment:
       POSTGRES_DB: billing
       POSTGRES_USER: billing
       POSTGRES_PASSWORD: billing
     ports:
       - 5432:5432
     volumes:
       - pgdata:/var/lib/postgresql/data
     healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing -d billing" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
   pgdata: